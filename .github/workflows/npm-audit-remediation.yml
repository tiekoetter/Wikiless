name: npm audit remediation

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: npm-audit-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture current audit findings
        shell: bash
        run: npm audit --json > "$RUNNER_TEMP/npm-audit-before.json" || true

      - name: Apply non-breaking audit fixes
        id: audit-fix
        continue-on-error: true
        run: npm audit fix --package-lock-only --ignore-scripts

      - name: Reinstall remediated dependencies
        id: install-remediated
        continue-on-error: true
        run: npm ci

      - name: Run tests
        id: tests
        if: steps.install-remediated.outcome == 'success'
        continue-on-error: true
        run: npm test

      - name: Capture remaining audit findings
        shell: bash
        run: npm audit --json > "$RUNNER_TEMP/npm-audit-after.json" || true

      - name: Create remediation report
        id: report
        env:
          AUDIT_FIX_OUTCOME: ${{ steps.audit-fix.outcome }}
          INSTALL_OUTCOME: ${{ steps.install-remediated.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          node .github/scripts/render-npm-audit-report.mjs \
            "$RUNNER_TEMP/npm-audit-before.json" \
            "$RUNNER_TEMP/npm-audit-after.json" \
            .github/npm-audit-report.md

      - name: Open or update remediation pull request
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            package.json
            package-lock.json
            .github/npm-audit-report.md
          branch: automation/npm-audit-remediation
          delete-branch: true
          commit-message: 'fix(deps): remediate npm audit findings'
          title: 'fix(deps): remediate npm audit findings'
          body: |
            `npm audit` found ${{ steps.report.outputs.before_total }} vulnerable package(s).

            - Remaining after the safe automated fix: ${{ steps.report.outputs.after_total }}
            - `npm audit fix` outcome: ${{ steps.audit-fix.outcome }}
            - Clean install outcome: ${{ steps.install-remediated.outcome }}
            - Test outcome: ${{ steps.tests.outcome }}
            - Manual review required: **${{ steps.report.outputs.manual_review }}**

            See [the generated remediation report](https://github.com/${{ github.repository }}/blob/automation/npm-audit-remediation/.github/npm-audit-report.md) for the remaining advisories and suggested next steps.

            This pull request was generated by the npm audit remediation workflow. It deliberately does not use `npm audit fix --force`, because that can install breaking dependency updates.
